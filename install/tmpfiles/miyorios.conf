# /run — tmpfs, не переживает перезагрузку; каталог сокетов брокера нужен на каждой загрузке
# root, а не оператор: демон от root создаёт здесь каталоги по имени спейса и правит им режим,
# а chown и chmod идут по симлинку — с записью для оператора это путь к root из менеджера
d /run/miyorios 0755 root root -
