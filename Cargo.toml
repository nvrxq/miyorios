[workspace]
resolver = "2"
members = ["components/agent", "components/daemon", "components/guid", "components/label", "components/manager", "lib/config", "lib/profile", "lib/proto", "lib/sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
basic-toml = "=0.1.10"
serde_json = "=1.0.151"
vsock = "=0.5.4"
gtk4 = "=0.11.4"
smithay-client-toolkit = "=0.21.1"
