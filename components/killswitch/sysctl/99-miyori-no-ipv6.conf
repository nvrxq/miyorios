# У br-host адреса IPv6 нет: любой исходящий v6 уходит к провайдеру мимо miyori-net
# с настоящим адресом оператора. Измерено 2026-09-02 — проба до Cloudflare по v6
# отвечала 301, то есть утекало каждое соединение, а не изредка.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# ::1 оставляем живым: с полностью выключенным v6 ломается всё, что слушает петлю
# по v6 — docker, часть системных служб, dev-инструменты
net.ipv6.conf.lo.disable_ipv6 = 0

# без этого роутер вернёт маршрут по умолчанию очередным RA, и слой отвалится молча
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
