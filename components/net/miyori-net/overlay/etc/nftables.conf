#!/usr/sbin/nft -f
# kill-switch: forward и output заперты, единственный путь наружу — @tunnels или cgroup tunnel
flush ruleset

table inet miyori {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		# isc-dhcp-client получает адрес физической карты в vfio-профиле — разрешаем ровно его
		udp sport 67 udp dport 68 accept

		# резолвер для хоста и спейсов: единственная служба, которую сетевая машина отдаёт внутрь.
		# Только с наших подсетей и только 53 — аплинк сюда не попадает, там другой iif
		iifname != @tunnels ip saddr { 10.59.0.0/24, 10.60.0.0/30 } udp dport 53 counter accept
		iifname != @tunnels ip saddr { 10.59.0.0/24, 10.60.0.0/30 } tcp dport 53 counter accept
	}

	# имя туннеля меняется на каждый перезапуск sing-box — множество вместо литерала, который устареет сразу
	set tunnels { type ifname; }

	# анти-спуфинг источника уже прошёл на br-spaces — ip saddr здесь доверенный,
	# а не имя интерфейса: без udev оно нестабильно между загрузками (miyori-net/init.sh)
	chain forward {
		type filter hook forward priority filter; policy drop;
		ip saddr 10.59.0.0/24 oifname @tunnels counter accept
		ip saddr 10.60.0.0/30 oifname @tunnels counter accept
		ct state established,related counter accept
		counter drop
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oif "lo" accept
		oifname @tunnels accept
		ct state established,related accept
		# waypipe/nekobox переносятся в эту cgroup перед запуском — miyori-net/init.sh, ADR-7 знает цену
		socket cgroupv2 level 1 "tunnel" accept
		# первичный DISCOVER идёт мимо netfilter через AF_PACKET, а unicast-renew — обычным сокетом и умрёт тут
		udp sport 68 udp dport 67 accept
	}
}
