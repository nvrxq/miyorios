id = "librewolf"
description = "Браузер в спейсе: LibreWolf из официального тарбола, нативный Wayland"

[base]
builder = "mmdebstrap"
suite   = "noble"
sources = [
  "deb http://archive.ubuntu.com/ubuntu noble main universe",
  "deb http://archive.ubuntu.com/ubuntu noble-updates main universe",
  "deb http://security.ubuntu.com/ubuntu noble-security main universe",
]
# apt-репозитория у LibreWolf для noble нет (deb.librewolf.net/dists/noble отдаёт 404),
# а firefox и chromium-browser в архиве — заглушки-снапы: в госте без snapd они не работают
packages = [
  "systemd-sysv", "iproute2", "nftables", "linux-image-virtual", "initramfs-tools", "e2fsprogs",
  # variant=minbase тянет только Priority:required, а у apt в noble important — сам он не приедет
  "apt",
  "ca-certificates", "dbus", "xz-utils", "less", "nano", "curl",
  "foot", "fonts-jetbrains-mono",
  "fonts-dejavu-core", "fonts-liberation2", "fonts-noto-core", "fonts-noto-color-emoji",
  # NEEDED у libxul: без gtk3 и alsa браузер не стартует вовсе
  "libgtk-3-0t64", "libasound2t64", "libdbus-1-3",
  "libfontconfig1", "libfreetype6",
  # эти двое в зависимости gtk3 не входят, а libxul линкует их напрямую
  "libx11-xcb1", "libxcb-shm0",
  "libxss1",
  # без ffmpeg отваливается H.264 и половина видео в вебе
  "libavcodec60",
  "libpulse0",
]

# официальная сборка с dl.librewolf.net, sha256 совпал с их же sha256sums.txt
[[base.blob]]
path   = "blobs/librewolf-155.0-1-linux-x86_64-package.tar.xz"
sha256 = "d7c45c5b1833f72cd497a91a314a465cec2d36713f63f884742d1165f7da0cdd"
into   = "/opt"
strip  = 0

[app]
mode    = "app"
command = "/usr/local/bin/miyori-app"

[resources]
# GPU в спейс не проброшен: рендер и сжатие кадров waypipe висят на CPU гостя
memory_mb = 6144
cpus      = 4
disk_gb   = 12
data_mb   = 16384

[isolation]
level = "standard"
gpu   = "none"

[network]
via = "miyori-net"
