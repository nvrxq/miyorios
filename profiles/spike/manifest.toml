id = "spike"
description = "Тестовый спейс: weston-terminal через waypipe, пробы сети и подмены заголовка окна"

[base]
builder = "mmdebstrap"
suite   = "noble"
sources = [
  "deb http://archive.ubuntu.com/ubuntu noble main universe",
  "deb http://archive.ubuntu.com/ubuntu noble-updates main universe",
  "deb http://security.ubuntu.com/ubuntu noble-security main universe",
]
# исходно guest/packages.list; e2fsprogs — mkfs.ext4/dumpe2fs для тома данных (задача 8)
packages = [
  "systemd-sysv", "iproute2", "nftables", "linux-image-virtual", "initramfs-tools",
  "libwayland-client0", "weston", "wayland-utils", "python3-minimal", "e2fsprogs",
]

[app]
mode    = "app"
command = "/usr/local/bin/miyori-app"

[resources]
memory_mb = 512
cpus      = 1
disk_gb   = 2
data_mb   = 64

[isolation]
level = "standard"
gpu   = "none"

[network]
via = "miyori-net"
