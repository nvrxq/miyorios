id = "web"
description = "Браузер в спейсе: epiphany на WebKitGTK, родной Wayland, без стороннего репозитория"

[base]
builder = "mmdebstrap"
suite   = "noble"
sources = [
  "deb http://archive.ubuntu.com/ubuntu noble main universe",
  "deb http://archive.ubuntu.com/ubuntu noble-updates main universe",
  "deb http://security.ubuntu.com/ubuntu noble-security main universe",
]
# firefox и chromium-browser в noble — заглушки-снапы (1snap1), в госте без snapd они не работают
packages = [
  "systemd-sysv", "iproute2", "nftables", "linux-image-virtual", "initramfs-tools", "e2fsprogs",
  "ca-certificates", "dbus", "fonts-dejavu-core", "fonts-liberation2",
  "epiphany-browser", "dconf-gsettings-backend",
]

[app]
mode    = "app"
command = "/usr/local/bin/miyori-app"

[resources]
memory_mb = 2048
cpus      = 2
disk_gb   = 6
data_mb   = 2048

[isolation]
level = "standard"
gpu   = "none"

[network]
via = "miyori-net"
