id = "tg"
description = "Telegram Desktop из официального тарбола"

[base]
builder = "mmdebstrap"
suite   = "noble"
sources = [
  "deb http://archive.ubuntu.com/ubuntu noble main universe",
  "deb http://archive.ubuntu.com/ubuntu noble-updates main universe",
  "deb http://security.ubuntu.com/ubuntu noble-security main universe",
]
# telegram-desktop в noble нет вовсе (только telegram-cli/telegram-send): Ubuntu отдаёт его
# исключительно snap-ом, а snapd в спейсе не поднять — PID 1 здесь miyori-init, не systemd
packages = [
  "systemd-sysv", "iproute2", "nftables", "linux-image-virtual", "initramfs-tools", "e2fsprogs",
  # variant=minbase тянет только Priority:required, а у apt в noble important — сам он не приедет
  "apt",
  "ca-certificates", "dbus", "fonts-dejavu-core", "fonts-liberation2",
  "foot", "fonts-jetbrains-mono", "fonts-noto-color-emoji",
  "git", "curl", "xz-utils", "unzip", "less", "nano", "openssh-client",
  "epiphany-browser", "dconf-gsettings-backend", "xdg-utils",
  # NEEDED статического телеграма: без них он не стартует вовсе
  "libglib2.0-0t64", "libfontconfig1", "libfreetype6",
  # остальное он открывает через dlopen уже на ходу — Qt-плагин wayland и загрузчики GL
  "libwayland-client0", "libwayland-cursor0", "libwayland-egl1",
  "libegl1", "libglx0", "libopengl0",
  # gtk3 не опция: заглушка implib падает по assert прямо на старте, если libgdk-3.so.0 нет
  "libgtk-3-0t64",
  # звук той же природы — заглушки, которые не умеют мягко отказать
  "libpulse0", "libasound2t64",
]

# официальная статическая сборка с td.telegram.org: свой Qt внутри, из архива только glib и шрифты
[[base.blob]]
path   = "blobs/tsetup-7.1.3.tar.xz"
sha256 = "bb6c3819148f03b79883c8b97b83399ce88e0a1b5cb3c6c05ac32b76ab3326df"
into   = "/opt"
strip  = 0

[app]
mode    = "app"
command = "/usr/local/bin/miyori-app"

[resources]
# GPU в спейс не проброшен: и телеграм, и waypipe жмут кадры на CPU гостя — на одном ядре лента дёргается
memory_mb = 4096
cpus      = 4
disk_gb   = 16
data_mb   = 8192

[isolation]
level = "standard"
gpu   = "none"

[network]
via = "miyori-net"
