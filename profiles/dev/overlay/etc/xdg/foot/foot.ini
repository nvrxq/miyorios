# гамма терминала намеренно тёплая, а не сине-синяя как у менеджера: похожие окна хоста и
# недоверенного спейса работают против узнавания, а признак доверия несут полоса и префикс
font=JetBrains Mono:size=11
pad=14x14
# заголовок называет назначение окна, а не имя программы; префикс спейса добавляет хост
title=терминал

[cursor]
style=beam
blink=yes
color=1a1816 e0784f

# waypipe не отдаёт гостю менеджер декораций, поэтому заголовок foot всегда рисует сам.
# Цвета здесь, в отличие от [colors], в AARRGGBB: без ff впереди полоса выходит прозрачной
[csd]
size=28
color=ff1a1816
button-color=ffe6e2d8

[scrollback]
lines=10000

[colors]
background=1a1816
foreground=e6e2d8
selection-background=3a352e
selection-foreground=e6e2d8
regular0=2a2622
regular1=d2564b
regular2=8fa65a
regular3=d9a441
regular4=6b93c4
regular5=b07cc6
regular6=5fa8a0
regular7=c8c2b6

bright0=4a443c
bright1=e57365
bright2=a8bf72
bright3=eebd5f
bright4=88aede
bright5=c897dd
bright6=79c2ba
bright7=e6e2d8
